name: Continuous Integration
on:
  pull_request:
    branches: [ develop, main ]
    paths-ignore:
      - "Infra/**"
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:

  linter:
    name: Linter (PHP-CS-Fixer)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer, cs2pr

      - name: 3. Cache PHP Dependencies
        uses: actions/cache@v4
        with:
          path: Backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('Backend/composer.lock') }}

      - name: 4. Configure Git for Private Packages
        run: git config --global url."https://x-access-token:${{ secrets.GH_ACCESS_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: 5. Install PHP Dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: ./Backend
          dependency-versions: "locked"
          composer-auth: '{"github-oauth": {"github.com": "${{ secrets.GH_ACCESS_TOKEN }}"}}'

      - name: 6. Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff -v
        working-directory: ./Backend

  security-vulnerabilities:
    name: Security Vulnerabilities (Composer)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: 3. Cache PHP Dependencies
        uses: actions/cache@v4
        with:
          path: Backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('Backend/composer.lock') }}

      - name: 4. Install PHP Dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: ./Backend
          dependency-versions: "locked"

      - name: 5. Check for Security Vulnerabilities
        run: composer audit --locked
        working-directory: ./Backend

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: 3. Cache PHP Dependencies
        uses: actions/cache@v4
        with:
          path: Backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('Backend/composer.lock') }}

      - name: 4. Install PHP Dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: ./Backend
          dependency-versions: "locked"

      - name: 5. Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G
        working-directory: ./Backend

  tests-php:
    name: Run PHP Tests (PHPUnit)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: redis
          coverage: pcov

      - name: 3. Cache PHP Dependencies
        uses: actions/cache@v4
        with:
          path: Backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('Backend/composer.lock') }}

      - name: 4. Install PHP Dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: ./Backend
          dependency-versions: "locked"

      - name: 5. Run PHPUnit tests
        run: vendor/bin/phpunit
        working-directory: ./Backend

  tests-angular:
    name: Run Angular Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Cache Node Modules
        uses: actions/cache@v4
        with:
          path: Frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('Frontend/package-lock.json') }}

      - name: 4. Install Angular Dependencies
        run: npm install
        working-directory: ./Frontend

      - name: 5. Setup Chrome
        run: sudo apt install -y chromium-browser

      - name: 6. Run Angular Unit Tests
        run: npm run test:ci
        working-directory: ./Frontend

  # docker-build:
  #   name: Validate Docker Build
  #   runs-on: ubuntu-latest
  #   if: github.event.pull_request.draft == false
  #   steps:
  #     - name: 1. Checkout Code
  #       uses: actions/checkout@v4

  #     - name: 2. Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3

  #     - name: 3. Build Docker image
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: .
  #         file: ./Infra/Containers/Dockerfile
  #         push: false
  #         load: false
  #         platforms: linux/amd64,linux/arm64
  #         tags: temp-base-image:php8.4
  #         build-args: |
  #           PHP_VERSION=8.4
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  tests:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [
      linter,
      security-vulnerabilities,
      static-analysis,
      tests-php,
      tests-angular
    ]
    if: success()
    steps:
      - run: echo "✅ All tests passed successfully!"

  containers:
    name: All Tests Containers Passed
    runs-on: ubuntu-latest
    needs: [
      linter,
      security-vulnerabilities,
      static-analysis,
      tests-php,
      tests-angular
    ]
    if: success()
    steps:
      - run: echo "✅ All tests containers passed successfully!"