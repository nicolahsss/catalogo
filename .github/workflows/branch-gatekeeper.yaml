name: Branch Gatekeeper

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main

jobs:
  validate-source-branch:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          
          echo "Pull Request source branch is: ${SOURCE_BRANCH}"
          
          if [[ "$SOURCE_BRANCH" == "develop" || "$SOURCE_BRANCH" == hotfix/* ]]; then
            echo "Branch is allowed. CI check passed."
            exit 0
          else
            echo "Error: Pull Requests to 'main' are only allowed from 'develop' or 'hotfix/*' branches."
            echo "Please open a Pull Request to 'develop' first."
            exit 1
          fi